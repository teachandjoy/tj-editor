<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Teach & Joy Diseñador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:      #1b4b85;
      --blue-dark: #0f2f5a;
      --blue-light:#e8f0fb;
      --red:       #8b2f3a;
      --gold:      #c5aa6f;
      --bg:        #ebeae7;
      --bg2:       #f5f4f1;
      --text:      #2a2a32;
      --text-sec:  #6b6b78;
      --border:    #d8d5cf;
      --white:     #ffffff;
      --success:   #1a7a4a;
      --radius:    8px;
      --font-h:    'Montserrat', sans-serif;
      --font-b:    'Open Sans', sans-serif;
      --shadow:    0 4px 24px rgba(27,75,133,.08);
      --transition:.3s cubic-bezier(.4,0,.2,1);
    }
    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-b); -webkit-font-smoothing: antialiased; }

    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:translateX(0); } }
    @keyframes modalIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .topbar {
      position: sticky; top: 0;
      height: 60px;
      background: var(--blue-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      z-index: 50;
      box-shadow: 0 1px 8px rgba(0,0,0,.12);
    }
    .topbar-logo img { height: 34px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .admin-name { color: rgba(255,255,255,.7); font-size: .82rem; }
    .btn-logout {
      background: rgba(255,255,255,.1);
      color: #fff; border: 1px solid rgba(255,255,255,.18);
      padding: 7px 16px; border-radius: var(--radius);
      font-family: var(--font-h); font-size: .78rem; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; gap: 6px;
    }
    .btn-logout svg { width: 14px; height: 14px; }
    .btn-logout:hover { background: rgba(255,255,255,.2); }

    .main { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }

    .page-header { margin-bottom: 32px; animation: fadeInUp .4s ease both; }
    .page-header h1 {
      font-family: var(--font-h); font-size: 1.7rem; font-weight: 800;
      color: var(--blue-dark); margin-bottom: 4px;
    }
    .page-header p { color: var(--text-sec); font-size: .92rem; }

    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      padding: 22px 24px; box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1.5px solid transparent;
      animation: fadeInUp .4s ease both;
    }
    .stat-card:nth-child(1) { animation-delay: .05s; }
    .stat-card:nth-child(2) { animation-delay: .1s; }
    .stat-card:nth-child(3) { animation-delay: .15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(27,75,133,.12); border-color: var(--blue-light); }
    .stat-label { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-sec); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .stat-label svg { width: 14px; height: 14px; color: var(--blue); }
    .stat-value { font-family: var(--font-h); font-size: 2rem; font-weight: 800; color: var(--blue); }

    .table-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      animation: fadeInUp .4s ease .2s both;
    }
    .table-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 12px;
    }
    .table-header h2 { font-family: var(--font-h); font-size: 1rem; font-weight: 700; color: var(--text); }
    .search-input {
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: .88rem; font-family: var(--font-b); color: var(--text);
      background: var(--bg2); outline: none; width: 240px; transition: var(--transition);
    }
    .search-input:focus { border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 3px rgba(27,75,133,.06); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th {
      text-align: left; padding: 12px 20px;
      font-family: var(--font-h); font-size: .72rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--text-sec);
      background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 20px; border-bottom: 1px solid var(--bg); font-size: .88rem; vertical-align: middle; transition: background .15s; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg2); }

    .badge-pct {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-family: var(--font-h); font-size: .72rem; font-weight: 700;
    }
    .badge-high   { background: #dcf5e8; color: #1a7a4a; }
    .badge-mid    { background: var(--blue-light); color: var(--blue); }
    .badge-low    { background: #faf0dc; color: #8a5e00; }

    .cell-titulo { font-weight: 600; color: var(--text); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-autor  { color: var(--text-sec); font-size: .82rem; }
    .cell-date   { color: var(--text-sec); font-size: .8rem; white-space: nowrap; }

    .btn-view {
      background: var(--blue-light); color: var(--blue);
      border: 1px solid var(--blue); border-radius: 6px;
      padding: 5px 12px; font-size: .78rem; font-family: var(--font-h);
      font-weight: 700; cursor: pointer; transition: var(--transition); margin-right: 4px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-view svg { width: 12px; height: 12px; }
    .btn-view:hover { background: var(--blue); color: #fff; }
    .btn-del {
      background: none; color: #c0392b; border: 1px solid #fbc9c9;
      border-radius: 6px; padding: 5px 10px; font-size: .78rem;
      cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-del svg { width: 12px; height: 12px; }
    .btn-del:hover { background: #fef0f0; }

    .empty-row td { text-align: center; color: var(--text-sec); padding: 48px; font-style: italic; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 200; padding: 40px 16px; overflow-y: auto;
    }
    .modal-card {
      background: var(--white); border-radius: 12px;
      width: 100%; max-width: 720px;
      box-shadow: 0 12px 48px rgba(0,0,0,.15);
      animation: modalIn .3s ease;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 28px; border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-family: var(--font-h); font-size: 1.05rem; font-weight: 800; color: var(--blue-dark); }
    .btn-close-modal {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--bg);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-sec); transition: var(--transition);
    }
    .btn-close-modal svg { width: 16px; height: 16px; }
    .btn-close-modal:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .modal-body { padding: 28px; overflow-y: auto; max-height: 70vh; }
    .modal-actions { padding: 18px 28px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    .detail-section { margin-bottom: 24px; }
    .detail-section-title {
      font-family: var(--font-h); font-size: .8rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--blue);
      margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--blue-light);
    }
    .detail-field { margin-bottom: 12px; }
    .detail-field-label { font-size: .73rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-sec); margin-bottom: 3px; }
    .detail-field-value { font-size: .9rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
    .detail-field-value.empty { color: #bbb; font-style: italic; font-size: .85rem; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
    .detail-tag { background: var(--blue-light); color: var(--blue); padding: 2px 9px; border-radius: 10px; font-size: .75rem; font-family: var(--font-h); font-weight: 600; }
    .modulo-detail {
      background: var(--bg2); border-left: 3px solid var(--blue);
      border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 16px; margin-bottom: 10px;
    }
    .modulo-detail h4 { font-family: var(--font-h); font-size: .88rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }

    .btn-pdf-admin {
      background: var(--red); color: #fff; border: none;
      padding: 10px 22px; border-radius: var(--radius); font-family: var(--font-h);
      font-size: .88rem; font-weight: 700; cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; gap: 7px;
    }
    .btn-pdf-admin svg { width: 15px; height: 15px; }
    .btn-pdf-admin:hover { background: #6d2028; transform: translateY(-1px); }

    .toast-container { position: fixed; bottom: 24px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--white); border-left: 4px solid var(--blue); border-radius: var(--radius); padding: 12px 16px; font-size: .87rem; box-shadow: var(--shadow); animation: slideIn .3s ease; max-width: 320px; display: flex; align-items: center; gap: 8px; }
    .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--red); color: var(--red); }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: 1fr; }
      .main { padding: 24px 16px 60px; }
      .page-header h1 { font-size: 1.3rem; }
      .topbar { padding: 0 16px; }
      .table-header { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .modal-card { max-width: 100%; }
      .modal-head { padding: 18px 20px; }
      .modal-body { padding: 20px; }
    }

    @media (max-width: 480px) {
      .topbar-logo img { height: 28px; }
      .stat-value { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">
    <img src="https://repositorio.paincare.mx/public/Logo_TeachJ_Blanco_2.png" alt="Teach & Joy">
  </div>
  <div class="topbar-right">
    <span class="admin-name" id="admin-name"></span>
    <button class="btn-logout" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      Cerrar sesion
    </button>
  </div>
</header>

<main class="main">
  <div class="page-header">
    <h1>Panel de Diseños Instruccionales</h1>
    <p>Todos los diseños enviados por usuarios de la herramienta</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        Total de diseños
      </div>
      <div class="stat-value" id="stat-total">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Completitud promedio
      </div>
      <div class="stat-value" id="stat-avg">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Con datos de contacto
      </div>
      <div class="stat-value" id="stat-contact">--</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>Diseños guardados</h2>
      <input type="text" class="search-input" id="search-input" placeholder="Buscar por titulo o autor..." oninput="filterTable()">
    </div>
    <div class="table-responsive" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Titulo del curso</th>
            <th>Autor / Email</th>
            <th>Completitud</th>
            <th>Fecha</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" style="text-align:center;padding:48px;color:#bbb;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Detail modal -->
<div class="modal" id="detail-modal" style="display:none;">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-titulo">Diseño Instruccional</h3>
      <button class="btn-close-modal" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-pdf-admin" id="btn-modal-pdf" onclick="printModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="18" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
        Exportar PDF
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
'use strict';
var BASE_PATH = (function() {
  var p = window.location.pathname;
  return p.substring(0, p.lastIndexOf('/'));
})();
var API = BASE_PATH + '/api.php?route=';
var ALL_ROWS = [];
var currentDetail = null;

// ── Auth check ────────────────────────────────────────────────
(async function() {
  try {
    var r = await fetch(API + '/auth/me', { credentials: 'same-origin' });
    var d = await r.json();
    if (!d.authenticated || d.role !== 'admin') {
      window.location.href = BASE_PATH + '/login.php';
      return;
    }
    document.getElementById('admin-name').textContent = d.name;
    loadDisenos();
  } catch(e) {
    window.location.href = BASE_PATH + '/login.php';
  }
})();

// ── Load data ─────────────────────────────────────────────────
async function loadDisenos() {
  try {
    var r = await fetch(API + '/disenos', { credentials: 'same-origin' });
    if (!r.ok) throw new Error();
    var rows = await r.json();
    ALL_ROWS = rows;
    renderStats(rows);
    renderTable(rows);
  } catch(e) {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#c0392b;padding:32px;">Error al cargar los diseños.</td></tr>';
  }
}

function renderStats(rows) {
  document.getElementById('stat-total').textContent = rows.length;
  var avg = rows.length ? Math.round(rows.reduce(function(s,r){ return s + (r.completitud||0); }, 0) / rows.length) : 0;
  document.getElementById('stat-avg').textContent = avg + '%';
  var withContact = rows.filter(function(r){ return r.autor_nombre || r.autor_email; }).length;
  document.getElementById('stat-contact').textContent = withContact;
}

function renderTable(rows) {
  var tbody = document.getElementById('table-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No hay diseños guardados aun.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(row) {
    var pct = row.completitud || 0;
    var badgeClass = pct >= 70 ? 'badge-high' : pct >= 40 ? 'badge-mid' : 'badge-low';
    var fecha = new Date(row.created_at).toLocaleDateString('es-MX', { year:'numeric', month:'short', day:'numeric' });
    return '<tr>' +
      '<td class="cell-titulo">' + esc(row.titulo || 'Sin titulo') + '</td>' +
      '<td class="cell-autor">' + (row.autor_nombre ? esc(row.autor_nombre) : '') + (row.autor_email ? '<br><small>' + esc(row.autor_email) + '</small>' : '') + (!row.autor_nombre && !row.autor_email ? '<em style="color:#bbb">Anonimo</em>' : '') + '</td>' +
      '<td><span class="badge-pct ' + badgeClass + '">' + pct + '%</span></td>' +
      '<td class="cell-date">' + fecha + '</td>' +
      '<td>' +
        '<button class="btn-view" onclick="viewDiseno(\'' + row.uuid + '\')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
          'Ver</button>' +
        '<button class="btn-del" onclick="deleteDiseno(\'' + row.uuid + '\', this)">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
          'Eliminar</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function filterTable() {
  var q = document.getElementById('search-input').value.toLowerCase();
  var filtered = ALL_ROWS.filter(function(r) {
    return (r.titulo||'').toLowerCase().includes(q) ||
           (r.autor_nombre||'').toLowerCase().includes(q) ||
           (r.autor_email||'').toLowerCase().includes(q);
  });
  renderTable(filtered);
}

// ── View detail ───────────────────────────────────────────────
async function viewDiseno(uuid) {
  try {
    var r = await fetch(API + '/disenos/' + uuid, { credentials: 'same-origin' });
    if (!r.ok) throw new Error();
    var row = await r.json();
    currentDetail = row;
    renderModal(row);
    document.getElementById('detail-modal').style.display = 'flex';
  } catch(e) {
    showToast('Error al cargar el diseño', 'error');
  }
}

function renderModal(row) {
  var d = row.datos_json || {};
  document.getElementById('modal-titulo').textContent = row.titulo || 'Diseño Instruccional';

  var html = '';

  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">Informacion general</div>';
  html += df('Autor', row.autor_nombre);
  html += df('Correo', row.autor_email);
  html += df('Guardado el', new Date(row.created_at).toLocaleString('es-MX'));
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">1. Identidad del Curso</div>';
  html += df('Titulo', d.titulo_curso);
  html += df('Autor / Institucion', d.autor_institucion);
  html += df('Modalidad', d.modalidad);
  html += df('Duracion', d.duracion);
  html += df('Version', d.version_fecha);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">2. Descripcion y Audiencia</div>';
  html += df('Descripcion', d.descripcion_breve);
  html += df('Publico objetivo', d.publico_objetivo);
  html += df('Requisitos previos', d.requisitos_previos);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">3. Proposito y Competencias</div>';
  html += df('Proposito general', d.proposito_general);
  html += df('Competencias', d.competencias);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">4. Modulos</div>';
  var mods = d.modulos || [];
  if (mods.length && mods[0].nombre) {
    mods.forEach(function(m, i) {
      if (!m.nombre) return;
      html += '<div class="modulo-detail"><h4>Modulo ' + (i+1) + ': ' + esc(m.nombre) + '</h4>';
      if (m.objetivo) html += df('Objetivo', m.objetivo);
      if (m.contenidos) html += df('Contenidos', m.contenidos);
      if (m.actividades) html += df('Actividades', m.actividades);
      html += '</div>';
    });
  } else {
    html += '<p style="color:#bbb;font-style:italic;font-size:.85rem">No definidos</p>';
  }
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">5. Actividades y Evaluacion</div>';
  html += dfTags('Actividades', d.actividades);
  html += dfTags('Tipos de evaluacion', d.evaluacion_tipos);
  html += df('Evidencias', d.evidencias);
  html += df('Nivel de aprobacion', d.nivel_aprobacion);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">6. Metodologia</div>';
  html += df('Enfoque', d.metodologia);
  html += df('Cronograma', d.cronograma);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">7. Recursos</div>';
  html += df('Recursos', d.recursos_materiales);
  html += df('Requerimientos tecnicos', d.requerimientos_tecnicos);
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">8. Politicas</div>';
  html += df('Entregas', d.politicas_entrega);
  html += df('Integridad', d.politicas_integridad);
  html += df('Comunicacion', d.canales_comunicacion);
  html += '</div>';

  document.getElementById('modal-body').innerHTML = html;
}

function df(label, val) {
  var empty = !val || (Array.isArray(val) && !val.length);
  return '<div class="detail-field">' +
    '<div class="detail-field-label">' + label + '</div>' +
    '<div class="detail-field-value' + (empty ? ' empty' : '') + '">' +
    (empty ? 'No especificado' : esc(String(val)).replace(/\n/g,'<br>')) +
    '</div></div>';
}

function dfTags(label, val) {
  if (!val || !Array.isArray(val) || !val.length) return df(label, null);
  var tags = val.map(function(v){ return '<span class="detail-tag">' + esc(v) + '</span>'; }).join('');
  return '<div class="detail-field"><div class="detail-field-label">' + label + '</div><div class="detail-tags">' + tags + '</div></div>';
}

function closeModal() {
  document.getElementById('detail-modal').style.display = 'none';
  currentDetail = null;
}

function printModal() {
  window.print();
}

// ── Delete ────────────────────────────────────────────────────
async function deleteDiseno(uuid, btn) {
  if (!confirm('Eliminar este diseño? Esta accion no se puede deshacer.')) return;
  btn.disabled = true;
  try {
    var r = await fetch(API + '/disenos/' + uuid, { method: 'DELETE', credentials: 'same-origin' });
    if (!r.ok) throw new Error();
    showToast('Diseño eliminado', 'success');
    await loadDisenos();
  } catch(e) {
    showToast('Error al eliminar', 'error');
    btn.disabled = false;
  }
}

// ── Logout ────────────────────────────────────────────────────
async function logout() {
  await fetch(API + '/auth/logout', { method: 'POST', credentials: 'same-origin' });
  window.location.href = BASE_PATH + '/login.php';
}

// ── Helpers ───────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var container = document.getElementById('toasts');
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type||'');
  var icoSvg = type === 'success'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>';
  toast.innerHTML = icoSvg + '<span>' + msg + '</span>';
  container.appendChild(toast);
  setTimeout(function(){
    toast.style.opacity='0'; toast.style.transition='opacity .3s';
    setTimeout(function(){ container.removeChild(toast); }, 300);
  }, 3000);
}
</script>
